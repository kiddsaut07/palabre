<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="PALABRE logo">
  <defs>
    <linearGradient id="lg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181614"/>
      <stop offset="100%" stop-color="#0B0B0B"/>
    </linearGradient>
    <radialGradient id="lg-glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes lp-pulse { 0%,100% { opacity:.35; transform:scale(1);} 50% { opacity:1; transform:scale(1.18);} }
      .lp-dot { transform-origin:186px 74px; animation: lp-pulse 1.6s ease-in-out infinite; }
      .lp-arc  { animation: lp-spin 9s linear infinite; transform-origin:128px 128px; }
      @keyframes lp-spin { to { transform: rotate(360deg);} }
      @keyframes lp-fade { 0%,100% { opacity:.25;} 50% { opacity:.9;} }
      .lp-ring { animation: lp-fade 3s ease-in-out infinite; }
    </style>
  </defs>

  <rect x="4" y="4" width="248" height="248" rx="56" fill="url(#lg-bg)" stroke="#2B2825" stroke-width="2"/>
  <circle cx="128" cy="128" r="104" fill="url(#lg-glow)"/>

  <!-- Compass ring -->
  <circle cx="128" cy="128" r="84" fill="none" stroke="#242220" stroke-width="10"/>
  <circle class="lp-ring" cx="128" cy="128" r="84" fill="none" stroke="#FF6B35" stroke-width="3"
          stroke-linecap="round" stroke-dasharray="70 458" opacity=".6"/>
  <!-- Rotating orbit arc -->
  <g class="lp-arc">
    <circle cx="128" cy="128" r="84" fill="none" stroke="#FF6B35" stroke-width="6"
            stroke-linecap="round" stroke-dasharray="150 378"/>
  </g>

  <!-- Monogram P -->
  <path d="M96 184V72h40c24 0 40 15 40 38s-16 38-40 38h-18" fill="none" stroke="#F2EEE8"
        stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Recording dot -->
  <circle class="lp-dot" cx="186" cy="74" r="13" fill="#FF6B35"/>
  <circle cx="186" cy="74" r="13" fill="none" stroke="#090909" stroke-width="3" opacity=".55"/>
</svg>

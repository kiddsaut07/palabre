<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Field proof: distance walked and time spent outside, captured with geolocation">
  <defs>
    <linearGradient id="fp-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0D0D0D"/>
    </linearGradient>
    <path id="fp-route" d="M448 330 C 520 322, 540 260, 604 252 S 706 268, 728 200 S 754 140, 800 118"/>
    <style>
      .fp-h   { font-family: Syne,'Arial Black',Impact,sans-serif; font-weight:800; fill:#F2EEE8; }
      .fp-t   { font-family:'Plus Jakarta Sans',Inter,Arial,sans-serif; fill:#A39E96; font-size:14px; }
      .fp-tag { font-family:'Plus Jakarta Sans',Inter,Arial,sans-serif; fill:#FF6B35; font-size:12px; font-weight:800; letter-spacing:2.5px; }
      @keyframes fp-march { to { stroke-dashoffset: -56; } }
      .fp-line { animation: fp-march 1.8s linear infinite; }
      @keyframes fp-tick { 0%,100% { opacity:.4;} 50% { opacity:1;} }
      .fp-dot { animation: fp-tick 1.5s ease-in-out infinite; }
      @keyframes fp-count { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-3px);} }
      .fp-lift { animation: fp-count 2.6s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1200" height="440" fill="#090909"/>

  <!-- ── Phone ─────────────────────────────── -->
  <g>
    <rect x="60" y="60" width="250" height="330" rx="34" fill="#141414" stroke="#2B2825" stroke-width="2"/>
    <rect x="74" y="74" width="222" height="302" rx="24" fill="#0B0B0B"/>
    <rect x="158" y="86" width="54" height="8" rx="4" fill="#242220"/>

    <text x="96" y="132" class="fp-tag">MISSION 03</text>
    <text x="96" y="164" class="fp-h" font-size="19">Find someone</text>
    <text x="96" y="188" class="fp-h" font-size="19">who works</text>
    <text x="96" y="212" class="fp-h" font-size="19">with their hands.</text>

    <!-- GPS chip -->
    <rect x="96" y="236" width="178" height="42" rx="14" fill="#1F1410" stroke="#FF6B35" stroke-opacity=".55"/>
    <circle class="fp-dot" cx="116" cy="257" r="6" fill="#FF6B35"/>
    <text x="132" y="262" class="fp-t" fill="#FF6B35" font-weight="700">GPS proof active</text>

    <!-- Timer -->
    <rect x="96" y="292" width="178" height="54" rx="14" fill="#0F0E0D" stroke="#242220"/>
    <text x="112" y="314" class="fp-t" font-size="12">TIME OUTSIDE</text>
    <text x="112" y="338" class="fp-h" font-size="20" fill="#FF6B35">07:12</text>
  </g>

  <!-- ── Map ───────────────────────────────── -->
  <g>
    <rect x="370" y="50" width="470" height="340" rx="24" fill="url(#fp-grad)" stroke="#242220" stroke-width="2"/>

    <!-- Roads -->
    <g stroke="#1C1A18" stroke-width="14" stroke-linecap="round">
      <path d="M400 150 H810"/>
      <path d="M400 270 H810"/>
      <path d="M520 80 V360"/>
      <path d="M690 80 V360"/>
    </g>
    <g stroke="#141414" stroke-width="3" stroke-dasharray="12 12">
      <path d="M400 150 H810"/>
      <path d="M520 80 V360"/>
    </g>

    <!-- Blocks -->
    <g fill="#171514">
      <rect x="536" y="166" width="138" height="88" rx="8"/>
      <rect x="706" y="166" width="96" height="88" rx="8"/>
      <rect x="536" y="286" width="138" height="58" rx="8"/>
    </g>
    <text x="716" y="216" class="fp-t" font-size="12" fill="#77736D">MARKET</text>

    <!-- Route -->
    <use href="#fp-route" fill="none" stroke="#242220" stroke-width="7" stroke-linecap="round"/>
    <use class="fp-line" href="#fp-route" fill="none" stroke="#FF6B35" stroke-width="7"
         stroke-linecap="round" stroke-dasharray="16 12"/>

    <!-- Home -->
    <g transform="translate(434 316)">
      <rect x="0" y="0" width="30" height="26" rx="5" fill="#141414" stroke="#F2EEE8" stroke-width="3"/>
      <path d="M-5 1 L15 -13 L35 1" fill="none" stroke="#F2EEE8" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Destination pin -->
    <g transform="translate(800 88)">
      <path d="M0 40 C -14 21, -21 14, -21 2 A21 21 0 1 1 21 2 C 21 14, 14 21, 0 40 Z"
            fill="#FF6B35" stroke="#090909" stroke-width="3"/>
      <circle cx="0" cy="2" r="7" fill="#090909"/>
    </g>

    <!-- Walker -->
    <circle r="9" fill="#F2EEE8" stroke="#FF6B35" stroke-width="3">
      <animateMotion dur="5s" repeatCount="indefinite"><mpath href="#fp-route"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.6;0.66" dur="5s" repeatCount="indefinite"/>
    </circle>

    <!-- Distance tag on the route -->
    <g class="fp-lift">
      <rect x="560" y="96" width="132" height="40" rx="20" fill="#0B0B0B" stroke="#FF6B35"/>
      <text x="626" y="121" text-anchor="middle" class="fp-h" font-size="17" fill="#FF6B35">650 m</text>
    </g>
  </g>

  <!-- ── Proof card ────────────────────────── -->
  <g>
    <rect x="890" y="110" width="260" height="220" rx="22" fill="#171513" stroke="#FF6B35" stroke-opacity=".45"/>
    <path d="M918 152 l10 -10 l10 10 l-10 10 z" fill="#FF6B35"/>
    <text x="950" y="157" class="fp-tag">FIELD PROOF</text>

    <text x="918" y="212" class="fp-h" font-size="42" fill="#F2EEE8">650 m</text>
    <text x="918" y="238" class="fp-t">walked straight-line</text>

    <rect x="918" y="256" width="204" height="1" fill="#242220"/>

    <text x="918" y="292" class="fp-h" font-size="30" fill="#FF6B35">7 min 12 s</text>
    <text x="918" y="316" class="fp-t">spent outside with a real human</text>
  </g>

  <text x="60" y="424" class="fp-t" fill="#77736D">
    Best-effort only: if geolocation is denied, the proof degrades to elapsed time — the quest never blocks.
  </text>
</svg>
